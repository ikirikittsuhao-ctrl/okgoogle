<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client - Games</title>
  <style>
    :root {
      --bg-dark: #111111;
      --panel-bg: rgba(24, 24, 24, 0.65);
      --card-bg: rgba(34, 34, 34, 0.5);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-hover: rgba(255, 255, 255, 0.3);
      --glass-glow: rgba(255, 255, 255, 0.05);
      --accent-red: #d0021b;
      --accent-red-hover: #ff1e38;
      --text-main: #f9f9f9;
      --text-muted: #8e8e8e;
      --border-color: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: #050505;
      background-image: 
        radial-gradient(at 0% 0%, rgba(208, 2, 27, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(208, 2, 27, 0.1) 0px, transparent 50%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
      perspective: 1000px;
    }

    /* --- 1. 起動時の切り裂く光フラッシュ演出 --- */
    .app-loader-flash {
      position: fixed;
      inset: 0;
      background-color: #000;
      z-index: 999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: loaderFadeOut 1.2s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    .loader-line {
      width: 0%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-red), #fff, var(--accent-red), transparent);
      box-shadow: 0 0 15px var(--accent-red), 0 0 30px #fff;
      animation: lineExpand 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes lineExpand {
      0% { width: 0%; opacity: 0; }
      50% { opacity: 1; }
      100% { width: 100%; opacity: 0; }
    }

    @keyframes loaderFadeOut {
      0%, 60% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* --- 2. 背景の連続的な発光＆フラッシュ --- */
    .bg-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(208, 2, 27, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      animation: glowLaunch 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards, pulseGlow 6s infinite alternate ease-in-out 1.4s;
    }

    @keyframes glowLaunch {
      0% { transform: scale(0.3); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 0.8; }
    }

    /* --- 3. クライアントメインウィンドウの強力な起動アニメーション＆Glassmorphism --- */
    .client-window {
      width: 1100px;
      max-width: 95vw;
      height: 680px;
      max-height: 92vh;
      background: rgba(17, 17, 17, 0.55);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      display: flex;
      position: relative;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      overflow: hidden;
      z-index: 1;

      /* 画面開く時の滑らかな立体飛び出しアニメーション */
      opacity: 0;
      transform: scale(0.85) translateY(40px) rotateX(8deg);
      filter: blur(12px);
      animation: windowLaunch 1s cubic-bezier(0.05, 0.7, 0.1, 1) 0.3s forwards;
      transform-origin: center center;
    }

    @keyframes windowLaunch {
      0% {
        opacity: 0;
        transform: scale(0.85) translateY(40px) rotateX(8deg);
        filter: blur(12px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotateX(0deg);
        filter: blur(0);
      }
    }

    /* 左側：サイドナビゲーションバー */
    .sidebar {
      width: 70px;
      background: rgba(10, 10, 10, 0.6);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 20px;
      z-index: 10;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background-color: var(--accent-red);
      clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
      margin-bottom: 20px;
      animation: brandPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.8s backwards;
    }

    @keyframes brandPop {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .nav-icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .nav-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .nav-icon:hover, .nav-icon.active {
      color: var(--text-main);
      background-color: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(5px);
    }

    .nav-icon.active {
      color: var(--accent-red);
    }

    .nav-icon.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 3px;
      background-color: var(--accent-red);
      border-radius: 0 2px 2px 0;
      box-shadow: 0 0 10px var(--accent-red);
    }

    /* メインコンテンツエリア */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: radial-gradient(circle at top right, rgba(40, 40, 40, 0.3) 0%, rgba(17, 17, 17, 0.2) 60%);
    }

    /* ヘッダーエリア（GAMESのみ） */
    .header {
      height: 80px;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.02);
    }

    .page-title {
      color: var(--text-main);
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0;
      animation: titleSlideIn 0.6s ease-out 0.7s forwards;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    @keyframes titleSlideIn {
      from { opacity: 0; transform: translateX(-15px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .window-controls {
      display: flex;
      gap: 16px;
      color: var(--text-muted);
    }

    .window-control-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.2s;
    }

    .window-control-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .window-control-btn:hover {
      color: var(--text-main);
    }

    /* ゲームグリッドエリア */
    .games-scroll-area {
      flex: 1;
      padding: 30px 40px;
      overflow-y: auto;
    }

    /* スクロールバー装飾 */
    .games-scroll-area::-webkit-scrollbar {
      width: 6px;
    }
    .games-scroll-area::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    .games-scroll-area::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 24px;
    }

    /* --- 4. ゲームカードの段階的浮き上がり（3Dチルト起動） & Glassmorphism --- */
    .game-card {
      position: relative;
      height: 310px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;

      /* 初期状態は非表示 */
      opacity: 0;
      animation: cardCascade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    /* 各カードに少しずつのディレイを設定 */
    .game-card:nth-child(1) { animation-delay: 0.65s; }
    .game-card:nth-child(2) { animation-delay: 0.75s; }
    .game-card:nth-child(3) { animation-delay: 0.85s; }
    .game-card:nth-child(4) { animation-delay: 0.95s; }
    .game-card:nth-child(5) { animation-delay: 1.05s; }
    .game-card:nth-child(6) { animation-delay: 1.15s; }

    @keyframes cardCascade {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.9) rotateX(-10deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotateX(0deg);
      }
    }

    .game-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 35px rgba(0,0,0,0.8), 0 0 20px rgba(208, 2, 27, 0.2);
      border-color: var(--glass-border-hover);
    }

    /* ビジュアル用画像背景 */
    .card-bg {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: transform 0.5s ease;
    }

    .game-card:hover .card-bg {
      transform: scale(1.06);
    }

    /* 指定画像および背景グラデーションスタイル */
    .bg-block-blast { background-image: url('img/games/blockblast.png'), linear-gradient(135deg, #0d1b2a 0%, #1b263b 40%, #e0a96d 100%); }
    .bg-tsumtsum    { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%); }
    .bg-paperio     { background-image: url('img/games/paperio.png'), linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); }
    .bg-snowrider   { background-image: url('img/games/snowrider.png'), linear-gradient(135deg, #83a4d4 0%, #b6fbff 100%); }
    .bg-projectx    { background: linear-gradient(135deg, #141e30 0%, #243b55 100%); }
    .bg-legends     { background: linear-gradient(135deg, #200122 0%, #6f0000 100%); }

    /* カード上のグラデーション＆テキスト */
    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(0, 0, 0, 0.85) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
    }

    .game-genre {
      color: var(--accent-red);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-shadow: 0 0 8px rgba(208, 2, 27, 0.5);
    }

    .game-name {
      color: var(--text-main);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* ホバー時に現れるプレイボタン */
    .play-btn {
      width: 100%;
      padding: 10px;
      background: rgba(208, 2, 27, 0.85);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: var(--text-main);
      font-weight: 800;
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.3s ease, transform 0.3s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card:hover .play-btn {
      opacity: 1;
      transform: translateY(0);
      box-shadow: 0 0 15px rgba(208, 2, 27, 0.6);
    }

    .play-btn:hover {
      background-color: var(--accent-red-hover);
    }

    /* --- 5. レスポンシブ対応 --- */
    @media (max-width: 1024px) {
      .client-window {
        width: 95vw;
        height: 85vh;
      }
      .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
      }
      .game-card {
        height: 270px;
      }
    }

    @media (max-width: 768px) {
      .client-window {
        flex-direction: column;
        height: 95vh;
      }
      .sidebar {
        width: 100%;
        height: 60px;
        flex-direction: row;
        justify-content: space-between;
        padding: 0 20px;
        border-right: none;
        border-bottom: 1px solid var(--glass-border);
      }
      .brand-icon {
        margin-bottom: 0;
      }
      .nav-icon.active::before {
        left: 10px;
        right: 10px;
        top: auto;
        bottom: 0;
        width: auto;
        height: 3px;
        border-radius: 2px 2px 0 0;
      }
      .header {
        height: 60px;
        padding: 0 20px;
      }
      .page-title {
        font-size: 1.4rem;
      }
      .games-scroll-area {
        padding: 20px;
      }
      .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }
      .game-card {
        height: 230px;
      }
      .play-btn {
        opacity: 1;
        transform: translateY(0);
        padding: 8px;
        font-size: 0.75rem;
      }
    }

    @media (max-width: 480px) {
      .games-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .game-card {
        height: 200px;
      }
      .card-overlay {
        padding: 12px;
      }
      .game-name {
        font-size: 0.95rem;
        margin-bottom: 8px;
      }
    }
  </style>
</head>
<body>

  <!-- 起動フラッシュ演出用オーバーレイ -->
  <div class="app-loader-flash">
    <div class="loader-line"></div>
  </div>

  <div class="bg-glow"></div>

  <div class="client-window">
    <!-- サイドナビゲーション（SVGアイコン使用） -->
    <div class="sidebar">
      <div class="brand-icon"></div>
      
      <!-- ゲーム一覧アイコン -->
      <div class="nav-icon active" title="GAMES">
        <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H9v2H7v-2H5v-2h2V9h2v2h2v2zm4.5 1c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      </div>
      
      <!-- お気に入りアイコン -->
      <div class="nav-icon" title="FAVORITES">
        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      </div>
      
      <!-- 設定アイコン -->
      <div class="nav-icon" title="SETTINGS">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="main-content">
      <!-- ヘッダー（タイトル: GAMES） -->
      <div class="header">
        <h1 class="page-title">GAMES</h1>
        <div class="window-controls">
          <div class="window-control-btn" title="Minimize">
            <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
          </div>
          <div class="window-control-btn" title="Close">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </div>
        </div>
      </div>

      <!-- ゲームカード一覧 -->
      <div class="games-scroll-area">
        <div class="games-grid">

          <!-- 1. ブロックブラスト -->
          <div class="game-card">
            <div class="card-bg bg-block-blast" style="background-image: url('img/games/blockblast.png');"></div>
            <div class="card-overlay">
              <span class="game-genre">Puzzle</span>
              <h3 class="game-name">Block Blast</h3>
              <button class="play-btn">PLAY</button>
            </div>
          </div>

          <!-- 2. つむつむ -->
          <div class="game-card">
            <div class="card-bg bg-tsumtsum"></div>
            <div class="card-overlay">
              <span class="game-genre">Casual</span>
              <h3 class="game-name">Tsum Tsum</h3>
              <button class="play-btn">PLAY</button>
            </div>
          </div>

          <!-- 3. paper.io -->
          <div class="game-card">
            <div class="card-bg bg-paperio" style="background-image: url('img/games/paperio.png');"></div>
            <div class="card-overlay">
              <span class="game-genre">Strategy & IO</span>
              <h3 class="game-name">Paper.io</h3>
              <button class="play-btn">PLAY</button>
            </div>
          </div>

          <!-- 4. snowrider -->
          <div class="game-card">
            <div class="card-bg bg-snowrider" style="background-image: url('img/games/snowrider.png');"></div>
            <div class="card-overlay">
              <span class="game-genre">Action & Sports</span>
              <h3 class="game-name">Snow Rider</h3>
              <button class="play-btn">PLAY</button>
            </div>
          </div>

          <!-- 5. PROJECT-X -->
          <div class="game-card">
            <div class="card-bg bg-projectx"></div>
            <div class="card-overlay">
              <span class="game-genre">Tactical Shooter</span>
              <h3 class="game-name">PROJECT-X</h3>
              <button class="play-btn">PLAY</button>
            </div>
          </div>

          <!-- 6. LEGENDS -->
          <div class="game-card">
            <div class="card-bg bg-legends"></div>
            <div class="card-overlay">
              <span class="game-genre">MOBA</span>
              <h3 class="game-name">LEGENDS</h3>
              <button class="play-btn">PLAY</button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

</body>
</html>
