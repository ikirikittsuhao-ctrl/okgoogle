<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>{% block title %}仙人Tube{% endblock %}</title>
    <link rel="icon" href="/img/logo/favicon.ico">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    <style>
        /* --- YouTube Official Theme Design Variables --- */
        :root {
            --yt-bg: #0f0f0f;
            --yt-header-bg: #0f0f0f;
            --yt-sidebar-bg: #0f0f0f;
            --yt-text-primary: #f1f1f1;
            --yt-text-secondary: #aaa;
            --yt-border-color: #272727;
            --yt-hover-bg: rgba(255, 255, 255, 0.1);
            --yt-active-bg: rgba(255, 255, 255, 0.2);
            --yt-chip-bg: #272727;
            --yt-chip-active-bg: #f1f1f1;
            --yt-chip-active-text: #0f0f0f;
            --yt-search-bg: #121212;
            --yt-search-btn-bg: #222222;
            --yt-brand-red: #ff0000;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --yt-bg: #ffffff;
                --yt-header-bg: #ffffff;
                --yt-sidebar-bg: #ffffff;
                --yt-text-primary: #0f0f0f;
                --yt-text-secondary: #606060;
                --yt-border-color: #e5e5e5;
                --yt-hover-bg: rgba(0, 0, 0, 0.05);
                --yt-active-bg: rgba(0, 0, 0, 0.1);
                --yt-chip-bg: rgba(0, 0, 0, 0.05);
                --yt-chip-active-bg: #0f0f0f;
                --yt-chip-active-text: #ffffff;
                --yt-search-bg: #ffffff;
                --yt-search-btn-bg: #f8f8f8;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', 'Noto Sans JP', sans-serif;
            background-color: var(--yt-bg);
            color: var(--yt-text-primary);
            overflow-x: hidden;
        }

        /* --- Header --- */
        #yt-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background-color: var(--yt-header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
        }

        .header-start {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--yt-text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .icon-btn:hover { background-color: var(--yt-hover-bg); }

        /* YouTube Icon-Only Logo (文字なし) */
        .yt-logo-icon {
            display: flex;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            padding: 4px;
        }
        .yt-logo-icon svg {
            height: 22px;
            width: auto;
        }

        /* --- Search Bar --- */
        .header-center {
            display: flex;
            align-items: center;
            flex: 0 1 732px;
            gap: 0;
            margin: 0 8px 0 8px; /* ロゴとの間隔を小さく変更 */
        }

        .search-form {
            display: flex;
            flex: 1;
            align-items: center;
        }

        .search-input-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper input {
            width: 100%;
            height: 40px;
            background-color: var(--yt-search-bg);
            border: 1px solid var(--yt-border-color);
            border-radius: 40px 0 0 40px;
            padding: 0 16px 0 20px;
            color: var(--yt-text-primary);
            font-size: 16px;
            outline: none;
        }

        .search-input-wrapper input:focus {
            border-color: #1c62b9;
        }

        .search-btn {
            height: 40px;
            width: 64px;
            background-color: var(--yt-search-btn-bg);
            border: 1px solid var(--yt-border-color);
            border-left: none;
            border-radius: 0 40px 40px 0;
            color: var(--yt-text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-btn:hover { background-color: var(--yt-hover-bg); }

        .header-end {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- Sidebar & Main Layout --- */
        .yt-container {
            display: flex;
            margin-top: 56px;
            min-height: calc(100vh - 56px);
        }

        #yt-sidebar {
            width: 240px;
            background-color: var(--yt-sidebar-bg);
            height: calc(100vh - 56px);
            position: fixed;
            top: 56px;
            left: 0;
            overflow-y: auto;
            padding: 12px;
            transition: width 0.2s ease, transform 0.2s ease;
            z-index: 900;
        }

        #yt-sidebar.collapsed {
            width: 72px;
            padding: 4px;
        }

        #yt-sidebar.collapsed .nav-item span:not(.material-symbols-outlined) {
            display: none;
        }
        #yt-sidebar.collapsed .nav-item {
            flex-direction: column;
            padding: 14px 0;
            font-size: 10px;
            justify-content: center;
            gap: 6px;
        }

        .nav-section {
            border-bottom: 1px solid var(--yt-border-color);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 10px 12px;
            color: var(--yt-text-primary);
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            transition: background 0.2s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover { background-color: var(--yt-hover-bg); }
        .nav-item.active {
            background-color: var(--yt-hover-bg);
            font-weight: 500;
        }

        .nav-item .material-symbols-outlined {
            font-size: 24px;
        }

        /* サイドバー展開用メニュー */
        .more-items {
            display: none;
        }

        #yt-main {
            flex: 1;
            margin-left: 240px;
            padding: 16px 24px;
            transition: margin-left 0.2s ease;
        }

        #yt-main.expanded {
            margin-left: 72px;
        }

        /* --- Status Toast (お知らせ通知) --- */
        .status-toast {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: #212121;
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2000;
            font-size: 14px;
            border-left: 4px solid var(--yt-brand-red);
        }

        .status-toast .close-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            padding: 0;
            display: flex;
        }

        /* YouTube Official-Style Autocomplete Overrides (UI強化) */
        .ui-autocomplete {
            background-color: #212121 !important;
            border: 1px solid var(--yt-border-color) !important;
            border-radius: 12px !important;
            color: var(--yt-text-primary) !important;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            padding: 8px 0 !important;
            margin-top: 4px;
            font-family: inherit;
            z-index: 1050 !important;
        }
        .ui-menu-item {
            list-style: none !important;
            padding: 0 4px !important;
        }
        .ui-menu-item-wrapper {
            padding: 6px 12px !important;
            display: flex !important;
            align-items: center !important;
            gap: 16px;
            font-size: 15px;
            font-weight: 400;
            color: var(--yt-text-primary) !important;
            border: none !important;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.1s ease;
        }
        .ui-menu-item-wrapper.ui-state-active {
            background-color: rgba(255, 255, 255, 0.15) !important;
            margin: 0 !important;
            font-weight: 500;
        }
        .suggest-item-content {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .suggest-item-content .suggest-icon {
            font-size: 20px;
            color: var(--yt-text-secondary);
            flex-shrink: 0;
        }
        .suggest-item-content .suggest-text {
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <header id="yt-header">
        <div class="header-start">
            <button class="icon-btn" id="menu-toggle" title="ナビゲーション">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <a href="/" class="yt-logo-icon" title="ホーム">
                <svg viewBox="0 0 68 48" width="30" height="22">
                    <path d="M66.52,7.74c-0.78-2.93-2.49-5.41-5.42-6.19C55.79,.13,34,0,34,0S12.21,.13,6.9,1.55 C3.97,2.33,2.27,4.81,1.48,7.74C0.06,13.05,0,24,0,24s0.06,10.95,1.48,16.26c0.78,2.93,2.49,5.41,5.42,6.19 C12.21,47.87,34,48,34,48s21.79-0.13,27.1-1.55c2.93-0.78,4.64-3.26,5.42-6.19C67.94,34.95,68,24,68,24S67.94,13.05,66.52,7.74z" fill="#FF0000"/>
                    <path d="M 45,24 27,14 27,34" fill="#FFFFFF"/>
                </svg>
            </a>
        </div>

        <div class="header-center">
            <form action="/search" method="get" class="search-form">
                <div class="search-input-wrapper">
                    <input id="searchbox" name="q" type="search" placeholder="検索" autocomplete="off" spellcheck="false" autofocus>
                </div>
                <button type="submit" class="search-btn" title="検索">
                    <span class="material-symbols-outlined">search</span>
                </button>
            </form>
        </div>

        <div class="header-end">
        </div>
    </header>

    <div class="yt-container">
        <aside id="yt-sidebar" class="collapsed">
            <div class="nav-section">
                <a href="/" class="nav-item active">
                    <span class="material-symbols-outlined">home</span>
                    <span>ホーム</span>
                </a>
                <a href="/subscriptions" class="nav-item">
                    <span class="material-symbols-outlined">subscriptions</span>
                    <span>登録チャンネル</span>
                </a>
            </div>

            <div class="nav-section">
                <a href="/history" class="nav-item">
                    <span class="material-symbols-outlined">history</span>
                    <span>履歴</span>
                </a>
                <a href="/games" class="nav-item">
                    <span class="material-symbols-outlined">sports_esports</span>
                    <span>ゲーム</span>
                </a>
                <a href="/tools" class="nav-item">
                    <span class="material-symbols-outlined">handyman</span>
                    <span>Tools</span>
                </a>
                
                <button class="nav-item" id="toggle-more-btn">
                    <span class="material-symbols-outlined" id="more-icon">expand_more</span>
                    <span id="more-label">その他</span>
                </button>

                <div class="more-items" id="more-items-container">
                    <a href="/bbs" class="nav-item">
                        <span class="material-symbols-outlined">forum</span>
                        <span>掲示板</span>
                    </a>
                    <a href="/status" class="nav-item">
                        <span class="material-symbols-outlined">analytics</span>
                        <span>稼働状況</span>
                    </a>
                </div>
            </div>
        </aside>

        <main id="yt-main" class="expanded">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div class="status-toast" id="statusToast">
        <span class="material-symbols-outlined" style="color:#ff4e4e;">info</span>
        <span id="infoContent">仙人Tubeへようこそ</span>
        <button class="close-btn" id="closeToast"><span class="material-symbols-outlined">close</span></button>
    </div>

    <script>
        $(document).ready(function () {
            // サイドバー開閉切り替え
            $("#menu-toggle").click(function () {
                if ($(window).width() <= 792) {
                    $("#yt-sidebar").toggleClass("mobile-open");
                } else {
                    $("#yt-sidebar").toggleClass("collapsed");
                    $("#yt-main").toggleClass("expanded");
                }
            });

            // サイドバーの「その他」アコーディオン展開切り替え
            $("#toggle-more-btn").click(function () {
                $("#more-items-container").slideToggle(150);
                const $icon = $("#more-icon");
                if ($icon.text() === "expand_more") {
                    $icon.text("expand_less");
                } else {
                    $icon.text("expand_more");
                }
            });

            // 検索オートコンプリート（高速化＆UI強化）
            const suggestCache = {};
            let currentXhr = null;

            $('#searchbox').autocomplete({
                delay: 0, // 入力即時反応で高速化
                minLength: 1,
                source: function (request, response) {
                    const term = request.term.trim();
                    if (term in suggestCache) {
                        response(suggestCache[term]);
                        return;
                    }

                    // 前回実行中のリクエストがあれば中止して高速化
                    if (currentXhr) {
                        currentXhr.abort();
                    }

                    currentXhr = $.ajax({
                        url: "/suggest",
                        dataType: "json",
                        data: { keyword: term },
                        success: function (data) {
                            suggestCache[term] = data;
                            response(data);
                        },
                        error: function (jqXHR, textStatus) {
                            if (textStatus !== 'abort') {
                                response([]);
                            }
                        }
                    });
                }
            }).autocomplete("instance")._renderItem = function(ul, item) {
                const label = typeof item === "string" ? item : item.label;
                return $("<li>")
                    .append(`
                        <div class="suggest-item-content">
                            <span class="material-symbols-outlined suggest-icon">search</span>
                            <span class="suggest-text">${label}</span>
                        </div>
                    `)
                    .appendTo(ul);
            };

            // 通知トーストメッセージの更新処理
            const messages = [
                "仙人Tubeを一から改良しました",
                "エラーの時は時間をおこう",
                "再生できないときはリロードしてね"
            ];
            let msgIdx = 0;
            setInterval(() => {
                if ($("#statusToast").is(":visible")) {
                    $("#infoContent").fadeOut(300, function () {
                        $(this).text(messages[msgIdx]).fadeIn(300);
                        msgIdx = (msgIdx + 1) % messages.length;
                    });
                }
            }, 6000);

            $("#closeToast").click(function () {
                $("#statusToast").fadeOut(300);
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
