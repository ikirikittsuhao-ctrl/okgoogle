<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>{% block title %}仙人Tube{% endblock %}</title>
    <link rel="icon" href="/img/logo/favicon.ico">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    <style>
        /* --- YouTube Official Theme Design Variables --- */
        :root {
            --yt-bg: #0f0f0f;
            --yt-header-bg: #0f0f0f;
            --yt-sidebar-bg: #0f0f0f;
            --yt-text-primary: #f1f1f1;
            --yt-text-secondary: #aaa;
            --yt-border-color: #272727;
            --yt-hover-bg: rgba(255, 255, 255, 0.1);
            --yt-active-bg: rgba(255, 255, 255, 0.2);
            --yt-chip-bg: #272727;
            --yt-chip-active-bg: #f1f1f1;
            --yt-chip-active-text: #0f0f0f;
            --yt-search-bg: #121212;
            --yt-search-btn-bg: #222222;
            --yt-suggest-bg: #212121;
            --yt-suggest-shadow: rgba(0, 0, 0, 0.6);
            --yt-brand-red: #ff0000;
            --yt-skeleton-bg: #222222;
            --yt-skeleton-shine: #333333;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --yt-bg: #ffffff;
                --yt-header-bg: #ffffff;
                --yt-sidebar-bg: #ffffff;
                --yt-text-primary: #0f0f0f;
                --yt-text-secondary: #606060;
                --yt-border-color: #e5e5e5;
                --yt-hover-bg: rgba(0, 0, 0, 0.05);
                --yt-active-bg: rgba(0, 0, 0, 0.1);
                --yt-chip-bg: rgba(0, 0, 0, 0.05);
                --yt-chip-active-bg: #0f0f0f;
                --yt-chip-active-text: #ffffff;
                --yt-search-bg: #ffffff;
                --yt-search-btn-bg: #f8f8f8;
                --yt-suggest-bg: #ffffff;
                --yt-suggest-shadow: rgba(0, 0, 0, 0.2);
                --yt-skeleton-bg: #e0e0e0;
                --yt-skeleton-shine: #f5f5f5;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', 'Noto Sans JP', sans-serif;
            background-color: var(--yt-bg);
            color: var(--yt-text-primary);
            overflow-x: hidden;
        }

        /* --- Top Progress Bar Animation --- */
        #yt-progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background-color: var(--yt-brand-red);
            width: 0%;
            z-index: 2000;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.7);
            transition: width 0.2s ease-out, opacity 0.3s ease;
        }

        /* --- Header --- */
        #yt-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background-color: var(--yt-header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
        }

        .header-start {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--yt-text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .icon-btn:hover { background-color: var(--yt-hover-bg); }

        /* YouTube Icon-Only Logo (文字なし) */
        .yt-logo-icon {
            display: flex;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            padding: 4px;
        }
        .yt-logo-icon svg {
            height: 22px;
            width: auto;
        }

        /* --- Search Bar --- */
        .header-center {
            display: flex;
            align-items: center;
            flex: 0 1 732px;
            gap: 0;
            margin: 0 8px 0 8px; /* ロゴとの間隔を小さく変更 */
        }

        .search-form {
            display: flex;
            flex: 1;
            align-items: center;
        }

        .search-input-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper input {
            width: 100%;
            height: 40px;
            background-color: var(--yt-search-bg);
            border: 1px solid var(--yt-border-color);
            border-radius: 40px 0 0 40px;
            padding: 0 16px 0 20px;
            color: var(--yt-text-primary);
            font-size: 16px;
            outline: none;
        }

        .search-input-wrapper input:focus {
            border-color: #1c62b9;
        }

        .search-btn {
            height: 40px;
            width: 64px;
            background-color: var(--yt-search-btn-bg);
            border: 1px solid var(--yt-border-color);
            border-left: none;
            border-radius: 0 40px 40px 0;
            color: var(--yt-text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-btn:hover { background-color: var(--yt-hover-bg); }

        .header-end {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- Sidebar & Main Layout --- */
        .yt-container {
            display: flex;
            margin-top: 56px;
            min-height: calc(100vh - 56px);
        }

        #yt-sidebar {
            width: 240px;
            background-color: var(--yt-sidebar-bg);
            height: calc(100vh - 56px);
            position: fixed;
            top: 56px;
            left: 0;
            overflow-y: auto;
            padding: 12px;
            transition: width 0.2s ease, transform 0.2s ease;
            z-index: 900;
        }

        #yt-sidebar.collapsed {
            width: 72px;
            padding: 4px;
        }

        #yt-sidebar.collapsed .nav-item span:not(.material-symbols-outlined) {
            display: none;
        }
        #yt-sidebar.collapsed .nav-item {
            flex-direction: column;
            padding: 14px 0;
            font-size: 10px;
            justify-content: center;
            gap: 6px;
        }

        .nav-section {
            border-bottom: 1px solid var(--yt-border-color);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 10px 12px;
            color: var(--yt-text-primary);
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            transition: background 0.2s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover { background-color: var(--yt-hover-bg); }
        .nav-item.active {
            background-color: var(--yt-hover-bg);
            font-weight: 500;
        }

        .nav-item .material-symbols-outlined {
            font-size: 24px;
        }

        /* サイドバー展開用メニュー */
        .more-items {
            display: none;
        }

        #yt-main {
            flex: 1;
            margin-left: 240px;
            padding: 16px 24px;
            transition: margin-left 0.2s ease, opacity 0.3s ease;
        }

        #yt-main.expanded {
            margin-left: 72px;
        }

        /* --- Skeleton Loading Animation --- */
        #page-loader-skeleton {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding: 16px 0;
        }

        .skeleton-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .skeleton-thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--yt-skeleton-bg) 25%, var(--yt-skeleton-shine) 50%, var(--yt-skeleton-bg) 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s infinite;
        }

        .skeleton-details {
            display: flex;
            gap: 12px;
        }

        .skeleton-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(90deg, var(--yt-skeleton-bg) 25%, var(--yt-skeleton-shine) 50%, var(--yt-skeleton-bg) 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s infinite;
            flex-shrink: 0;
        }

        .skeleton-text-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .skeleton-line {
            height: 14px;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--yt-skeleton-bg) 25%, var(--yt-skeleton-shine) 50%, var(--yt-skeleton-bg) 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s infinite;
        }

        .skeleton-line.title { width: 90%; height: 16px; }
        .skeleton-line.subtitle { width: 60%; }

        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Content Fade In Animation */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- レスポンシブ表示設定 (画面の大きさに合わせた表示切り替え) --- */
        @media (max-width: 792px) {
            #yt-sidebar {
                transform: translateX(-100%);
                width: 240px !important;
            }
            #yt-sidebar.mobile-open {
                transform: translateX(0);
            }
            #yt-sidebar .nav-item span:not(.material-symbols-outlined) {
                display: inline !important;
            }
            #yt-sidebar .nav-item {
                flex-direction: row !important;
                padding: 10px 12px !important;
                font-size: 14px !important;
                justify-content: flex-start !important;
                gap: 24px !important;
            }
            #yt-main, #yt-main.expanded {
                margin-left: 0 !important;
                padding: 12px 16px;
            }
            .header-center {
                max-width: none;
            }
        }

        @media (max-width: 480px) {
            #yt-header {
                padding: 0 8px;
            }
            .search-input-wrapper input {
                padding: 0 12px;
                font-size: 14px;
            }
            .search-btn {
                width: 48px;
            }
            #yt-main {
                padding: 8px 12px;
            }
        }

        /* YouTube Official-Style Autocomplete Overrides (ライト/ダーク対応) */
        .ui-autocomplete {
            background-color: var(--yt-suggest-bg) !important;
            border: 1px solid var(--yt-border-color) !important;
            border-radius: 12px !important;
            color: var(--yt-text-primary) !important;
            box-shadow: 0 4px 16px var(--yt-suggest-shadow) !important;
            padding: 8px 0 !important;
            margin-top: 4px;
            font-family: inherit;
            z-index: 1050 !important;
        }
        .ui-menu-item {
            list-style: none !important;
            padding: 0 4px !important;
        }
        .ui-menu-item-wrapper {
            padding: 6px 12px !important;
            display: flex !important;
            align-items: center !important;
            gap: 16px;
            font-size: 15px;
            font-weight: 400;
            color: var(--yt-text-primary) !important;
            background-color: transparent !important;
            border: none !important;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.1s ease;
        }
        .ui-menu-item-wrapper.ui-state-active {
            background-color: var(--yt-hover-bg) !important;
            color: var(--yt-text-primary) !important;
            margin: 0 !important;
            font-weight: 500;
        }
        .suggest-item-content {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--yt-text-primary);
        }
        .suggest-item-content .suggest-icon {
            font-size: 20px;
            color: var(--yt-text-secondary);
            flex-shrink: 0;
        }
        .suggest-item-content .suggest-text {
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--yt-text-primary);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Red Top Progress Bar -->
    <div id="yt-progress-bar"></div>

    <header id="yt-header">
        <div class="header-start">
            <button class="icon-btn" id="menu-toggle" title="ナビゲーション">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <a href="/" class="yt-logo-icon" title="ホーム">
                <svg viewBox="0 0 68 48" width="30" height="22">
                    <path d="M66.52,7.74c-0.78-2.93-2.49-5.41-5.42-6.19C55.79,.13,34,0,34,0S12.21,.13,6.9,1.55 C3.97,2.33,2.27,4.81,1.48,7.74C0.06,13.05,0,24,0,24s0.06,10.95,1.48,16.26c0.78,2.93,2.49,5.41,5.42,6.19 C12.21,47.87,34,48,34,48s21.79-0.13,27.1-1.55c2.93-0.78,4.64-3.26,5.42-6.19C67.94,34.95,68,24,68,24S67.94,13.05,66.52,7.74z" fill="#FF0000"/>
                    <path d="M 45,24 27,14 27,34" fill="#FFFFFF"/>
                </svg>
            </a>
        </div>

        <div class="header-center">
            <form action="/search" method="get" class="search-form" id="search-form">
                <div class="search-input-wrapper">
                    <input id="searchbox" name="q" type="search" placeholder="検索" autocomplete="off" spellcheck="false" autofocus>
                </div>
                <button type="submit" class="search-btn" title="検索">
                    <span class="material-symbols-outlined">search</span>
                </button>
            </form>
        </div>

        <div class="header-end">
        </div>
    </header>

    <div class="yt-container">
        <aside id="yt-sidebar" class="collapsed">
            <div class="nav-section">
                <a href="/" class="nav-item active">
                    <span class="material-symbols-outlined">home</span>
                    <span>ホーム</span>
                </a>
                <a href="/subscriptions" class="nav-item">
                    <span class="material-symbols-outlined">subscriptions</span>
                    <span>登録チャンネル</span>
                </a>
            </div>

            <div class="nav-section">
                <a href="/history" class="nav-item">
                    <span class="material-symbols-outlined">history</span>
                    <span>履歴</span>
                </a>
                <a href="/setting" class="nav-item">
                    <span class="material-symbols-outlined">settings</span>
                    <span>設定</span>
                </a>
            </div>
        </aside>

        <main id="yt-main" class="expanded">
            <!-- Skeleton Loader UI (初期読み込みおよび遷移時に表示) -->
            <div id="page-loader-skeleton">
                <div class="skeleton-card">
                    <div class="skeleton-thumbnail"></div>
                    <div class="skeleton-details">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-text-group">
                            <div class="skeleton-line title"></div>
                            <div class="skeleton-line subtitle"></div>
                        </div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-thumbnail"></div>
                    <div class="skeleton-details">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-text-group">
                            <div class="skeleton-line title"></div>
                            <div class="skeleton-line subtitle"></div>
                        </div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-thumbnail"></div>
                    <div class="skeleton-details">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-text-group">
                            <div class="skeleton-line title"></div>
                            <div class="skeleton-line subtitle"></div>
                        </div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-thumbnail"></div>
                    <div class="skeleton-details">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-text-group">
                            <div class="skeleton-line title"></div>
                            <div class="skeleton-line subtitle"></div>
                        </div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-thumbnail"></div>
                    <div class="skeleton-details">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-text-group">
                            <div class="skeleton-line title"></div>
                            <div class="skeleton-line subtitle"></div>
                        </div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-thumbnail"></div>
                    <div class="skeleton-details">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-text-group">
                            <div class="skeleton-line title"></div>
                            <div class="skeleton-line subtitle"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="actual-content" style="display: none;">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script>
        // Progress Bar Controller
        const YTProgress = {
            $bar: null,
            timer: null,
            start: function() {
                this.$bar = $('#yt-progress-bar');
                if (!this.$bar.length) return;
                
                clearTimeout(this.timer);
                this.$bar.css({ opacity: 1, width: '0%' });

                let progress = 0;
                this.timer = setInterval(() => {
                    if (progress < 70) {
                        progress += Math.random() * 15;
                    } else if (progress < 90) {
                        progress += Math.random() * 3;
                    }
                    this.$bar.css('width', progress + '%');
                }, 100);
            },
            done: function() {
                if (!this.$bar.length) return;
                clearInterval(this.timer);
                this.$bar.css('width', '100%');
                setTimeout(() => {
                    this.$bar.css('opacity', 0);
                    setTimeout(() => {
                        this.$bar.css('width', '0%');
                    }, 300);
                }, 200);
            }
        };

        // ページロード開始時にプログレスバーをスタート
        YTProgress.start();

        $(document).ready(function () {
            // 画面構築完了時のアニメーション処理
            setTimeout(function() {
                YTProgress.done();
                $('#page-loader-skeleton').fadeOut(200, function() {
                    $('#actual-content').addClass('fade-in').show();
                });
            }, 300);

            // 内部リンク遷移時にローディングアニメーションを発火
            $(document).on('click', 'a[href^="/"]:not([target="_blank"]):not([href^="#"])', function(e) {
                const href = $(this).attr('href');
                if (href && href !== '#' && href !== window.location.pathname) {
                    YTProgress.start();
                }
            });

            // サイドバー開閉切り替え
            $("#menu-toggle").click(function () {
                if ($(window).width() <= 792) {
                    $("#yt-sidebar").toggleClass("mobile-open");
                } else {
                    $("#yt-sidebar").toggleClass("collapsed");
                    $("#yt-main").toggleClass("expanded");
                }
            });

            // --- 検索履歴管理機能 (localStorage / 最大5件) ---
            const HISTORY_KEY = 'yt_search_history';

            function getSearchHistory() {
                try {
                    return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
                } catch(e) {
                    return [];
                }
            }

            function saveSearchQuery(query) {
                if (!query || !query.trim()) return;
                let history = getSearchHistory();
                const cleanQuery = query.trim();
                // 重複を除去
                history = history.filter(item => item !== cleanQuery);
                // 先頭に追加
                history.unshift(cleanQuery);
                // 最新5件のみ保存
                if (history.length > 5) history = history.slice(0, 5);
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            }

            // 検索実行時に履歴を保存 & プログレス表示
            $("#search-form").on("submit", function() {
                saveSearchQuery($("#searchbox").val());
                YTProgress.start();
            });

            // --- 検索オートコンプリート（履歴 & サジェスト & 高速化 & UI強化） ---
            const suggestCache = {};
            let currentXhr = null;

            $('#searchbox').autocomplete({
                delay: 0,
                minLength: 0, // 0文字（フォーカス時）で履歴を表示
                source: function (request, response) {
                    const term = request.term.trim();

                    // 空入力時は検索履歴（最大5件）を表示
                    if (term === "") {
                        const history = getSearchHistory().map(item => ({
                            label: item,
                            isHistory: true
                        }));
                        response(history);
                        return;
                    }

                    // キャッシュ確認
                    if (term in suggestCache) {
                        response(suggestCache[term]);
                        return;
                    }

                    // 前回リクエストの中止
                    if (currentXhr) {
                        currentXhr.abort();
                    }

                    currentXhr = $.ajax({
                        url: "/suggest",
                        dataType: "json",
                        data: { keyword: term },
                        success: function (data) {
                            const formattedData = data.map(item => ({
                                label: typeof item === "string" ? item : item.label,
                                isHistory: false
                            }));
                            suggestCache[term] = formattedData;
                            response(formattedData);
                        },
                        error: function (jqXHR, textStatus) {
                            if (textStatus !== 'abort') {
                                response([]);
                            }
                        }
                    });
                },
                select: function(event, ui) {
                    saveSearchQuery(ui.item.label);
                    YTProgress.start();
                }
            }).focus(function() {
                // 入力欄にフォーカスした際に履歴を表示できるように発火
                $(this).autocomplete("search", $(this).val());
            }).autocomplete("instance")._renderItem = function(ul, item) {
                const iconName = item.isHistory ? "history" : "search";
                return $("<li>")
                    .append(`
                        <div class="suggest-item-content">
                            <span class="material-symbols-outlined suggest-icon">${iconName}</span>
                            <span class="suggest-text">${item.label}</span>
                        </div>
                    `)
                    .appendTo(ul);
            };
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
